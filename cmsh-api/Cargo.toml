[package]
name = "cmsh-api"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Backend contract for the cmsh transport facade: addresses, capabilities, stream, datagram and DHT traits"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-libs/cmsh"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[dependencies]
async-trait = "0.1.89"
futures-io = "0.3.31"
zeroize = "1.8"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
