name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Private sibling dependencies reachable
        # cfbk is a private repository. GITHUB_TOKEN cannot read it, and the
        # CI policy keeps stored credentials out of external CI. Until access is
        # decided, fail here with a clear message instead of deep in cargo.
        run: |
          if ! git ls-remote https://github.com/corbet-foss/cfbk HEAD >/dev/null 2>&1; then
            echo "::error::corbet-foss/cfbk is not readable from this runner (private). See README, CI."
            exit 1
          fi
      - name: Stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Wasm build (browser target compatibility)
        run: |
          cargo build -p cmsh-api --target wasm32-unknown-unknown
          cargo build -p cmsh --lib --target wasm32-unknown-unknown
