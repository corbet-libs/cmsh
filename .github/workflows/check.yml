name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "AGENTS.md", "LICENSE.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo generate-lockfile
      - run: python3 .github/check-first-party.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo check --locked --target wasm32-unknown-unknown --lib
      - name: Install matching wasm runner
        run: |
          cargo metadata --locked --format-version 1 > dependency-metadata.json
          version=$(jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' dependency-metadata.json)
          archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"
          mkdir -p "$RUNNER_TEMP/wasm-runner"
          cd "$RUNNER_TEMP/wasm-runner"
          curl -A 'transport-ci/1.0' --fail --location --retry 3 --remote-name "$base/$archive"
          curl -A 'transport-ci/1.0' --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"
          checksum=$(cut -d ' ' -f1 "$archive.sha256sum")
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Execute identical wasm stream vectors
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked --target wasm32-unknown-unknown --test streams
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            dependency-metadata.json
