[workspace]
members = [".", "cmsh-api"]
resolver = "3"

[package]
name = "cmsh"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "P2P transport facade: addresses, streams, fallback and guarantees over the cvln and ctrn networks"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cmsh"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# In-memory mock backends for consumers' tests.
mock = ["tokio/io-util"]

[dependencies]
cmsh-api = { path = "cmsh-api" }
cfbk = { git = "https://github.com/corbet-foss/cfbk", rev = "bc0a6dad90cb6f683e40b3fce37d898be3da32a4" }
yamux = "0.14.1"
futures = "0.3.31"
bytes = "1.10"
tokio-util = { version = "0.7.16", default-features = false, features = ["codec", "compat"] }
tokio = { version = "1.47", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-util", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
