[package]
name = "cmsh"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "P2P transport facade: bounded messages, fallback and guarantees over the cvln and ctrn networks"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cmsh"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
tor = ["dep:ctrn"]

[dependencies]
cfbk = { git = "https://github.com/corbet-foss/cfbk", branch = "main" }
ctrn = { git = "https://github.com/corbet-foss/ctrn", branch = "main", default-features = false, optional = true }
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
cfry = { git = "https://github.com/corbet-foss/cfry", branch = "main" }
tokio = { version = "1.47", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
